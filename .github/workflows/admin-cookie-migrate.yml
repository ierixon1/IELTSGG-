name: Admin cookie migration

on:
  push:
    branches: [security-hardening]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'ierixon1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          admin_dir = Path('src/components/admin')

          def rewrite_admin_component(path: Path):
              s = path.read_text()
              s = re.sub(r'^\s*adminToken:\s*string;\n', '', s, flags=re.M)
              s = s.replace('  adminToken,\n', '')
              s = s.replace('adminToken={adminToken}', '')
              s = s.replace('adminToken={adminToken}\\n', '')
              s = re.sub(r'^\s*Authorization:\s*`Bearer \$\{adminToken\}`,?\n', '', s, flags=re.M)
              s = re.sub(r"\n\s*useEffect\(\(\) => \{", "\n  useEffect(() => {", s)
              s = s.replace('  }, [adminToken]);', '  }, []);')
              # Every admin request is same-origin and therefore carries the HttpOnly cookie.
              s = re.sub(r"(fetch\([^\n]+,\s*\{\n)(?!\s*credentials: 'same-origin',)", r"\1        credentials: 'same-origin',\n", s)
              s = re.sub(r"fetch\(([^,]+), \{\s*\n\s*method:", r"fetch(\1, {\n        credentials: 'same-origin',\n        method:", s)
              path.write_text(s)

          for p in admin_dir.glob('*.tsx'):
              rewrite_admin_component(p)

          # Admin login has no token callback or client-side session secret.
          p = admin_dir / 'AdminLogin.tsx'
          s = p.read_text()
          s = s.replace('onLoginSuccess: (token: string, admin: AdminUser) => void;', 'onLoginSuccess: (admin: AdminUser) => void;')
          s = s.replace("      onLoginSuccess(data.token || '', data.admin);", "      onLoginSuccess(data.admin);")
          p.write_text(s)

          # App owns only a non-sensitive cached admin identity; the session itself is HttpOnly.
          p = Path('src/App.tsx')
          s = p.read_text()
          s = re.sub(r"\n  const \[adminToken, setAdminToken\] = useState<string \| null>\(\(\) => localStorage\.getItem\('prep_admin_token'\)\);", '', s)
          s = s.replace("          isAdminAuthenticated={Boolean(adminToken && adminUser)}", "          isAdminAuthenticated={Boolean(adminUser)}")
          s = s.replace("            {!adminToken || !adminUser ? (", "            {!adminUser ? (")
          s = re.sub(r"onLoginSuccess=\{\(token, user\) => \{\s*setAdminToken\(token\);\s*setAdminUser\(user\);\s*\}\}", "onLoginSuccess={(user) => { setAdminUser(user); }}", s)
          s = re.sub(r"\s*adminToken=\{adminToken\}", '', s)
          s = re.sub(r"\s*onLogout=\{\(\) => \{\s*localStorage\.removeItem\('prep_admin_token'\);\s*localStorage\.removeItem\('prep_admin_user'\);\s*setAdminToken\(null\);\s*setAdminUser\(null\);\s*\}\}", " onLogout={async () => { try { await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' }); } finally { localStorage.removeItem('prep_admin_user'); setAdminUser(null); } }}", s)
          # Validate cached identity against the server-side cookie once on mount.
          marker = "  // Load initial data on mount\n"
          if marker in s and 'fetch(\'/api/admin/me'' not in s:
              validation = "  useEffect(() => {\n    fetch('/api/admin/me', { credentials: 'same-origin' })\n      .then(async r => { if (!r.ok) throw new Error('admin session invalid'); return r.json(); })\n      .then(data => { if (data?.admin) { localStorage.setItem('prep_admin_user', JSON.stringify(data.admin)); setAdminUser(data.admin); } })\n      .catch(() => { localStorage.removeItem('prep_admin_user'); setAdminUser(null); });\n  }, []);\n\n"
              s = s.replace(marker, validation + marker)
          p.write_text(s)

          # Server: isolated HttpOnly admin session cookie.
          p = Path('src/routes/adminRoutes.ts')
          s = p.read_text()
          s = s.replace("type AdminRequest=Request&{adminUser?:{id:string;username:string;displayName:string;role:string}};", "type AdminRequest=Request&{adminUser?:{id:string;username:string;displayName:string;role:string};adminSessionToken?:string};\nconst ADMIN_AUTH_COOKIE='prep_admin_auth';\nconst readCookie=(req:Request,name:string)=>{const header=req.headers.cookie||'';for(const part of header.split(';')){const [k,...v]=part.trim().split('=');if(k===name)return decodeURIComponent(v.join('='));}return '';};")
          old = "export async function requireAdminAuth(req:AdminRequest,res:Response,next:NextFunction){try{const h=req.headers.authorization;if(!h?.startsWith('Bearer '))return res.status(403).json({error:'Forbidden.'});const s=await authService.validateSession(h.slice(7).trim());if(!s||(s.role!=='admin'&&s.role!=='examiner'))return res.status(403).json({error:'Forbidden.'});req.adminUser={id:s.userId,username:s.username,displayName:s.name,role:s.role};return next();}catch{return res.status(403).json({error:'Forbidden.'});}}"
          new = "export async function requireAdminAuth(req:AdminRequest,res:Response,next:NextFunction){try{const token=readCookie(req,ADMIN_AUTH_COOKIE);if(!token)return res.status(403).json({error:'Forbidden.'});const s=await authService.validateSession(token);if(!s||(s.role!=='admin'&&s.role!=='examiner'))return res.status(403).json({error:'Forbidden.'});req.adminSessionToken=token;req.adminUser={id:s.userId,username:s.username,displayName:s.name,role:s.role};return next();}catch{return res.status(403).json({error:'Forbidden.'});}}"
          if old not in s:
              raise SystemExit('admin auth middleware pattern not found')
          s = s.replace(old, new)
          old_login = "adminRouter.post('/login',async(req,res)=>{try{const r=await authService.login(String(req.body?.username||''),String(req.body?.password||''));if(r.user.role!=='admin'&&r.user.role!=='examiner')return res.status(403).json({error:'Forbidden.'});return res.json({success:true,token:r.token,admin:{username:r.user.username,displayName:r.user.name,role:r.user.role}});}catch{return res.status(401).json({error:'Invalid credentials.'});}});"
          new_login = "adminRouter.post('/login',async(req,res)=>{try{const r=await authService.login(String(req.body?.username||''),String(req.body?.password||''));if(r.user.role!=='admin'&&r.user.role!=='examiner')return res.status(403).json({error:'Forbidden.'});res.cookie(ADMIN_AUTH_COOKIE,r.token,{httpOnly:true,sameSite:'strict',secure:process.env.NODE_ENV==='production',path:'/api/admin',maxAge:24*60*60*1000});return res.json({success:true,admin:{id:r.user.id,username:r.user.username,name:r.user.name,role:r.user.role}});}catch{return res.status(401).json({error:'Invalid credentials.'});}});"
          if old_login not in s:
              raise SystemExit('admin login pattern not found')
          s = s.replace(old_login, new_login)
          old_logout = "adminRouter.post('/logout',requireAdminAuth,async(req:AdminRequest,res)=>{try{const h=req.headers.authorization;if(h?.startsWith('Bearer '))await authService.logout(h.slice(7).trim());}catch{}return res.json({success:true});});"
          new_logout = "adminRouter.post('/logout',requireAdminAuth,async(req:AdminRequest,res)=>{try{await authService.logout(req.adminSessionToken||'');}catch{}res.clearCookie(ADMIN_AUTH_COOKIE,{httpOnly:true,sameSite:'strict',secure:process.env.NODE_ENV==='production',path:'/api/admin'});return res.json({success:true});});"
          if old_logout not in s:
              raise SystemExit('admin logout pattern not found')
          s = s.replace(old_logout, new_logout)
          p.write_text(s)

          # Remove the temporary migration file before committing so it cannot re-run.
          Path('.github/workflows/admin-cookie-migrate.yml').unlink()
          PY

          if grep -R --line-number --exclude-dir=node_modules --exclude-dir=.git 'prep_admin_token\|Authorization: `Bearer \${adminToken}`\|adminToken' src/components/admin src/App.tsx src/routes/adminRoutes.ts; then
            echo 'Admin token references remain after migration.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: move admin CMS auth to HttpOnly cookie' || exit 0
          git push
