name: Admin cookie migration

on:
  push:
    branches: [security-hardening]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'ierixon1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail

          # Remove adminToken plumbing from every CMS editor/upload component.
          for f in src/components/admin/*.tsx; do
            perl -0pi -e 's/\s+adminToken\??\s*:\s*string\s*;?//g; s/,\s*adminToken\s*,/,/g; s/,\s*adminToken\s*\}/\}/g; s/\{\s*adminToken\s*,/\{/g; s/\s+adminToken=\{adminToken\}//g; s/\s*Authorization:\s*`Bearer \$\{adminToken\}`,?//g; s/\},\s*\[adminToken\]\);/}, []);/g' "$f"
          done

          # Ensure all admin frontend requests carry same-origin cookies.
          grep -rl --include='*.tsx' "fetch('/api/admin" src/components/admin | while read -r f; do
            perl -0pi -e "s/(fetch\([^\n]+,\s*\{\s*)(?!credentials: 'same-origin')/\$1credentials: 'same-origin', /g" "$f"
          done

          # Admin login callback returns only identity; session stays in HttpOnly cookie.
          perl -0pi -e 's/onLoginSuccess: \(token: string, admin: AdminUser\) => void;/onLoginSuccess: (admin: AdminUser) => void;/g; s/onLoginSuccess\(data\.token \|\| '\''\'', data\.admin\)/onLoginSuccess(data.admin)/g; s/\s*localStorage\.removeItem\(['\''"]prep_admin_token['\''"]\);//g' src/components/admin/AdminLogin.tsx

          # App: remove admin token state/props, keep only cached identity.
          perl -0pi -e 's/^\s*const \[adminToken, setAdminToken\].*\n//mg; s/isAdminAuthenticated=\{Boolean\(adminToken && adminUser\)\}/isAdminAuthenticated={Boolean(adminUser)}/g; s/!adminToken \|\| !adminUser/!adminUser/g; s/onLoginSuccess=\{\(token, user\) => \{\s*setAdminToken\(token\);\s*setAdminUser\(user\);\s*\}\}/onLoginSuccess={(user) => setAdminUser(user)}/g; s/\s*adminToken=\{adminToken\}//g; s/onLogout=\{\(\) => \{\s*localStorage\.removeItem\('\''prep_admin_token'\''\);\s*localStorage\.removeItem\('\''prep_admin_user'\''\);\s*setAdminToken\(null\);\s*setAdminUser\(null\);\s*\}\}/onLogout={async () => { try { await fetch('\''\/api\/admin\/logout'\'', { method: '\''POST'\'', credentials: '\''same-origin'\'' }); } finally { localStorage.removeItem('\''prep_admin_user'\''); setAdminUser(null); } }}/g' src/App.tsx

          # Server: admin-only HttpOnly cookie.
          perl -0pi -e "s/type AdminRequest=Request&\{adminUser\?:\{id:string;username:string;displayName:string;role:string\}\};/type AdminRequest=Request\&{adminUser?:{id:string;username:string;displayName:string;role:string};adminSessionToken?:string};\nconst ADMIN_AUTH_COOKIE='prep_admin_auth';\nconst readCookie=(req:Request,name:string)=>{const header=req.headers.cookie||'';for(const part of header.split(';')){const [k,...v]=part.trim().split('=');if(k===name)return decodeURIComponent(v.join('='));}return '';};/" src/routes/adminRoutes.ts
          perl -0pi -e 's/export async function requireAdminAuth.*?\nexport function requireAdminRole/export async function requireAdminAuth(req:AdminRequest,res:Response,next:NextFunction){try{const token=readCookie(req,ADMIN_AUTH_COOKIE);if(!token)return res.status(403).json({error:'\''Forbidden.'\''});const session=await authService.validateSession(token);if(!session||(session.role!== '\''admin'\''\&\&session.role!== '\''examiner'\''))return res.status(403).json({error:'\''Forbidden.'\''});req.adminSessionToken=token;req.adminUser={id:session.userId,username:session.username,displayName:session.name,role:session.role};return next();}catch{return res.status(403).json({error:'\''Forbidden.'\''});}}\nexport function requireAdminRole/s' src/routes/adminRoutes.ts
          perl -0pi -e "s#adminRouter\.post\('/login'.*?\nadminRouter\.get\('/me'#adminRouter.post('/login',async(req,res)=>{try{const r=await authService.login(String(req.body?.username||''),String(req.body?.password||''));if(r.user.role!=='admin'\&\&r.user.role!=='examiner')return res.status(403).json({error:'Forbidden.'});res.cookie(ADMIN_AUTH_COOKIE,r.token,{httpOnly:true,sameSite:'strict',secure:process.env.NODE_ENV==='production',path:'/api/admin',maxAge:24*60*60*1000});return res.json({success:true,admin:{id:r.user.id,username:r.user.username,name:r.user.name,role:r.user.role}});}catch{return res.status(401).json({error:'Invalid credentials.'});}});\nadminRouter.get('/me'#s" src/routes/adminRoutes.ts
          perl -0pi -e "s#adminRouter\.post\('/logout'.*?\nadminRouter\.get\('/files'#adminRouter.post('/logout',requireAdminAuth,async(req:AdminRequest,res)=>{try{await authService.logout(req.adminSessionToken||'');}catch{}res.clearCookie(ADMIN_AUTH_COOKIE,{httpOnly:true,sameSite:'strict',secure:process.env.NODE_ENV==='production',path:'/api/admin'});return res.json({success:true});});\nadminRouter.get('/files'#s" src/routes/adminRoutes.ts

          # Validate syntax-level invariants only; TypeScript/build CI is authoritative.
          test "$(grep -R --include='*.tsx' -l 'adminToken' src/components/admin 2>/dev/null | wc -l)" -eq 0
          test "$(grep -R --include='*.tsx' -l 'prep_admin_token' src/components/admin src/App.tsx 2>/dev/null | wc -l)" -eq 0
          grep -q "ADMIN_AUTH_COOKIE='prep_admin_auth'" src/routes/adminRoutes.ts

          rm -f .github/workflows/admin-cookie-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: move admin CMS auth to HttpOnly cookie'
          git push
